name: Pilzrisotto
description: Cremiges Risotto mit gebratenen Champignons und getrockneten Steinpilzen, verfeinert mit Butter und Parmesan.
author: EmmiKochtEinfach
url: https://emmikochteinfach.de/pilzrisotto/
category: 🥦
servings: 4
prep_time: 10
cook_time: 30
kcal: 511
import_date: '2026-10-16'
image: images/recipes/pilzrisotto.jpg
tags:
- Butter
- Champignons
- Gemüsebrühe
- Käse
- Öl
- Parmesan
- Pilze
- Reis
- Steinpilze
- Zwiebel

ingredients:
- name: Gemüsebrühe
  amount: 750 ml
- name: Wasser (kochend)
  amount: 300 ml
- name: Risottoreis
  amount: 250 g
- name: Champignons (braun)
  amount: 150 g
- name: Steinpilze (getrocknet)
  amount: 30 g
- name: Parmesan
  amount: 75 g
- name: Zwiebel
  amount: 50 g
- name: Butter
  amount: 50 g
- name: Pflanzenöl (neutral)
  amount: 3 EL
- name: Salz und Pfeffer
  amount: nach Geschmack

instructions:
- Gemüsebrühe aufkochen und warm halten. Getrocknete Steinpilze ca. 5 Minuten in 300 ml kochendem Wasser einweichen.
- Champignons putzen und würfeln. Steinpilze abgießen (Einweichwasser auffangen) und klein schneiden. Zwiebel fein würfeln.
- 2 EL Öl in einem weiten Topf erhitzen, Champignons darin 3–5 Minuten scharf anbraten und beiseitestellen.
- 20 g Butter und 1 EL Öl im Topf erhitzen, Steinpilze und Zwiebel darin glasig dünsten. Reis zugeben und rühren, bis er mit Fett überzogen ist.
- Mit dem Einweichwasser ablöschen und fast vollständig einköcheln lassen. Dann unter ständigem Rühren schöpflöffelweise Brühe zugeben, bis der Reis nach ca. 30 Minuten gar ist. Währenddessen Parmesan fein reiben.
- Champignons, 30 g Butter und Parmesan unterrühren und mit Salz und Pfeffer abschmecken.
