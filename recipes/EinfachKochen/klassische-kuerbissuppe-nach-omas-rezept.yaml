name: Klassische Kürbissuppe nach Omas Rezept
description: Cremige Kürbissuppe aus Hokkaido und Kartoffeln mit Sahne, Petersilie und einem Hauch Muskatnuss.
author: EinfachKochen
url: https://www.einfachkochen.de/rezepte/klassische-kuerbissuppe-nach-omas-rezept
category: 🍲
servings: 4
prep_time: 15
cook_time: 20
kcal: 428
import_date: '2026-10-16'
image: images/recipes/klassische-kuerbissuppe-nach-omas-rezept.jpg
tags:
- Brot
- Butter
- Gemüsebrühe
- Kartoffeln
- Knoblauch
- Kürbis
- Muskatnuss
- Petersilie
- Sahne
- Zwiebel

ingredients:
- name: Hokkaidokürbis (ca. 800 g)
  amount: 1
- name: Kartoffeln (ca. 200 g)
  amount: 2
- name: Zwiebeln
  amount: 2
- name: Knoblauchzehe
  amount: 1
- name: Butter
  amount: 2 EL
- name: Gemüsebrühe
  amount: 1 l
- name: Petersilie
  amount: 0.5 Bund
- name: Sahne
  amount: 100 ml
- name: Muskatnuss (frisch gerieben)
  amount: nach Geschmack
- name: Salz und Pfeffer
  amount: nach Geschmack
- name: Vollkornbrot
  amount: 8 Scheiben

instructions:
- Kürbis waschen, entstielen, halbieren und Kerne mit einem Löffel entfernen. Kartoffeln schälen. Kürbis und Kartoffeln grob würfeln. Zwiebeln würfeln, Knoblauch fein hacken.
- Butter in einem großen Topf erhitzen und die Zwiebeln 2–3 Minuten anbraten. Knoblauch, Kürbis und Kartoffeln kurz mitbraten und mit Gemüsebrühe ablöschen.
- Aufkochen und mit Deckel bei mittlerer Hitze ca. 20 Minuten köcheln lassen, bis Kürbis und Kartoffeln weich sind. Petersilie in der Zwischenzeit fein hacken.
- Suppe fein pürieren, Sahne unterrühren und nach Wunsch mit etwas Wasser oder Brühe verdünnen. Mit Salz, Pfeffer und Muskatnuss abschmecken.
- Mit Petersilie garnieren und mit Vollkornbrot servieren.
