name: Kürbis-Risotto
description: Cremiges Risotto mit Kürbis, Frühlingszwiebeln, Crème fraîche und Parmesan, getoppt mit frischer Kresse.
author: Chefkoch
url: https://www.chefkoch.de/rezepte/351681120497520/Kuerbis-Risotto.html
category: 🥦
servings: 4
prep_time: 20
cook_time: 25
kcal: 625
import_date: '2026-10-16'
image: images/recipes/kuerbis-risotto.jpg
tags:
- Butter
- Crème fraîche
- Frühlingszwiebeln
- Gemüsebrühe
- Käse
- Knoblauch
- Kresse
- Kürbis
- Öl
- Olivenöl
- Parmesan
- Reis
- Schalotte
- Weißwein

ingredients:
- name: Kürbisfleisch
  amount: 450 g
- name: Schalotte
  amount: 1
- name: Knoblauchzehe
  amount: 1
- name: Olivenöl
  amount: 2 EL
- name: Butter
  amount: 2 EL
- name: Risottoreis
  amount: 350 g
- name: Weißwein
  amount: 100 ml
- name: Gemüsebrühe (heiß)
  amount: 1 l
- name: Frühlingszwiebeln
  amount: 1 Bund
- name: Crème fraîche
  amount: 3 EL
- name: Parmesan (frisch gerieben)
  amount: 50 g
- name: Pfeffer
  amount: nach Geschmack
- name: Kresse
  amount: 0.5 Kästchen

instructions:
- Kürbisfleisch in Streifen schneiden. Schalotte und Knoblauch fein hacken.
- Öl erhitzen und die Butter darin zerlassen. Knoblauch, Schalotte und Kürbis darin andünsten. Reis einstreuen und kurz mitdünsten.
- Mit Wein ablöschen und aufkochen. Nach und nach die heiße Brühe angießen und den Reis ca. 20 Minuten ausquellen lassen.
- Frühlingszwiebeln in Ringe schneiden und 5 Minuten vor Ende der Garzeit dazugeben.
- Crème fraîche und Parmesan unterheben, mit Pfeffer würzen und mit Kresse bestreut servieren.
