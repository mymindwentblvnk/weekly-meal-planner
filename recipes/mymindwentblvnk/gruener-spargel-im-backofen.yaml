name: Grüner Spargel im Backofen
description: Wenige Zutaten, maximaler Geschmack - dieses Frühlingsrezept kombiniert Spargel aus dem Ofen mit Kartoffeln und Kirschtomaten für zusätzliche Vitamine und Ballaststoffe.
author: mymindwentblvnk
url: https://www.einfachkochen.de/rezepte/gruener-spargel-im-backofen-so-einfach-lecker
category: 🍲
servings: 1
prep_time: 25
cook_time: 25
kcal: 334
import_date: 2026-05-10
image: images/recipes/gruener-spargel-im-backofen.jpg
tags:
  - Chili
  - Kartoffeln
  - Käse
  - Olivenöl
  - Parmesan
  - Spargel
  - Tomaten
  - Zitrone

ingredients:
  - name: Kartoffeln
    amount: 500 g
  - name: Salz
    amount: etwas
  - name: Spargel (grün)
    amount: 500 g
  - name: Cherrytomaten
    amount: 200 g
  - name: Olivenöl
    amount: 1,5 EL
  - name: Zitronensaft
    amount: 1 EL
  - name: Pfeffer
    amount: etwas
  - name: Chiliflocken
    amount: etwas
  - name: Parmesan (oder Montello)
    amount: 2 EL

instructions:
  - Kartoffeln schälen, in Spalten schneiden und in Salzwasser ca. 20 Minuten gar kochen.
  - Backofen auf 200°C (180°C Umluft) vorheizen. Spargel waschen, holzige Enden abschneiden, unteres Drittel bei Bedarf schälen. Tomaten waschen und halbieren.
  - Olivenöl, Zitronensaft, Salz, Pfeffer und Chiliflocken vermischen. Spargel und Tomaten mit der Marinade in einer rechteckigen Auflaufform (28cm x 17cm) sanft vermengen. Tomaten sollten größtenteils obenauf liegen. Auf mittlerer Schiene ca. 25 Minuten backen.
  - Kartoffeln abgießen und mit Spargel und Tomaten auf Tellern verteilen. Mit Parmesan toppen.
