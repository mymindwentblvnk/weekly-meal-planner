name: Heidelbeer-Mais-Salat
description: Erfrischender Sommersalat mit Heidelbeeren, Mais und Koriander
author: mymindwentblvnk
category: 🥦
servings: 2
prep_time: 10
cook_time: 20
image: images/recipes/heidelbeer-mais-salat.jpg
tags:
- Gurke
- Heidelbeeren
- Honig
- Koriander
- Limette
- Mais
- Olivenöl
- Zwiebeln
ingredients:
- name: Maiskolben
  amount: 2
- name: Heidelbeeren
  amount: 200 g
- name: Gurke (klein)
  amount: 1
- name: Rote Zwiebel
  amount: 1/2
- name: Koriander (frisch)
  amount: nach Geschmack
- name: Limettensaft
  amount: 3 EL
- name: Olivenöl
  amount: 1 EL
- name: Honig
  amount: 2 TL
- name: Salz und Pfeffer
  amount: nach Geschmack
instructions:
- Maiskolben in Salzwasser 15-20 Minuten kochen.
- Heidelbeeren waschen. Gurke längs halbieren und in Scheiben schneiden. Zwiebel fein
  würfeln.
- Für das Dressing Limettensaft, Olivenöl, Honig, Salz und Pfeffer verrühren.
- Alle Zutaten vermengen und mit frischem Koriander garnieren.
import_date: '2026-02-26'
