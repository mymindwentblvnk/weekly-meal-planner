name: Wassermelonen-Feta-Salat
description: Erfrischender Sommersalat mit Minze und Limetten-Dressing
author: mymindwentblvnk
category: 🥦
servings: 4
prep_time: 15
cook_time: 0
image: images/recipes/wassermelonen-feta-salat.jpg
tags:
- Feta
- Käse
- Limette
- Minze
- Wassermelone
ingredients:
- name: Wassermelone (klein)
  amount: 1
- name: Feta
  amount: 150 g
- name: Minze (frisch)
  amount: 4 Stiele
- name: Limette (Saft)
  amount: 1
- name: Ahornsirup
  amount: 1 TL
- name: Salz und Pfeffer
  amount: nach Geschmack
instructions:
- Für das Dressing Limettensaft auspressen und mit Ahornsirup, Salz und Pfeffer vermischen.
- Wassermelone vierteln und das Fruchtfleisch in mundgerechte Stücke schneiden. In
  eine Schüssel geben und mit dem Dressing vermengen.
- Feta zerbröseln und vorsichtig unterheben. Minzblätter von den Stielen zupfen und
  als Garnitur verwenden.
import_date: '2026-02-26'
