name: Skyr-Käsekuchen ohne Boden
description: Cremiger Käsekuchen aus Skyr, der ganz ohne Boden auskommt - mit wenigen Zutaten schnell gemacht und dazu noch low carb.
author: mymindwentblvnk
url: https://www.einfachbacken.de/rezepte/skyr-kaesekuchen-ohne-boden-das-cremigste-rezept
category: 🥣
servings: 12
prep_time: 10
cook_time: 50
import_date: 2026-10-07
image: images/recipes/skyr-kaesekuchen-ohne-boden.jpg
tags:
  - Backen
  - Beeren
  - Eier
  - Heidelbeeren
  - Sahne
  - Skyr
  - Zucker

ingredients:
  - name: Skyr
    amount: 1000 g
  - name: Zucker
    amount: 170 g
  - name: Vanillepuddingpulver (alternativ 40 g Speisestärke)
    amount: 1 Packung
  - name: Sahne
    amount: 200 g
  - name: Eier (Größe M)
    amount: 4
  - name: Blaubeeren (zum Garnieren)
    amount: nach Belieben

instructions:
  - Backofen auf 180°C (160°C Umluft) vorheizen. Den Boden einer Springform (Ø 26 cm) mit Backpapier auslegen.
  - Skyr mit Zucker und Vanillepuddingpulver glatt rühren. Flüssige Sahne und Eier zugeben und alles verrühren.
  - Masse in die Form füllen und ca. 15 Minuten backen. Dann die Temperatur auf 160°C Ober-/Unterhitze (140°C Umluft) reduzieren und in ca. 35 Minuten fertig backen.
  - Ofentür öffnen und den Kuchen im Ofen auskühlen lassen.
  - Ausgekühlten Kuchen aus der Form lösen, Backpapier vorsichtig entfernen und nach Belieben mit Blaubeeren garnieren. Ergibt ca. 12 Stücke und hält sich gekühlt mindestens 3 Tage.
