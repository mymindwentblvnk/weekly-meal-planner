name: Glasnudelsalat
description: Asiatischer Glasnudelsalat mit Soja-Limetten-Dressing
author: mymindwentblvnk
category: 🥦
servings: 4
prep_time: 20
cook_time: 0
image: images/recipes/glasnudelsalat.jpg
tags:
- Erdnüsse
- Frühlingszwiebeln
- Glasnudeln
- Gurke
- Knoblauch
- Limette
- Möhren
- Nüsse
- Paprika
- Sesamöl
- Sojasoße
- Zwiebeln
ingredients:
- name: Glasnudeln
  amount: 100 g
- name: Möhren
  amount: 200 g
- name: Rote Paprika
  amount: 1
- name: Mini-Gurken
  amount: 2
- name: Frühlingszwiebeln
  amount: 3
- name: Erdnüsse
  amount: 4 EL
- name: Knoblauchzehe
  amount: 1
- name: Sojasoße
  amount: 3 EL
- name: Limette (Saft)
  amount: 1
- name: Sesamöl
  amount: 2 EL
- name: Ahornsirup
  amount: 2 EL
- name: Salz und Pfeffer
  amount: nach Geschmack
instructions:
- Glasnudeln mit kochendem Wasser übergießen, 5 Minuten ziehen lassen, abgießen und
  klein schneiden. Möhren raspeln, Paprika in Streifen schneiden, Gurken in Scheiben
  schneiden, Frühlingszwiebeln in Ringe schneiden.
- Für das Dressing Knoblauch fein hacken. Sojasoße, Limettensaft, Sesamöl, Ahornsirup
  und Knoblauch in einer Schüssel vermischen. Mit Salz und Pfeffer abschmecken.
- Alle Salatzutaten in einer Schüssel vermengen, mit dem Dressing vermischen und mit
  Erdnüssen garnieren.
