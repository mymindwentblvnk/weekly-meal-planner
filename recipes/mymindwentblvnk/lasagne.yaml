name: Lasagne
description: Klassische Lasagne mit würzigem Ragú Bolognese, cremiger Béchamelsauce
  und geschichteten Vollkornreisnudeln, überbacken mit Käse.
author: mymindwentblvnk
category: 🥩
servings: 4
prep_time: 30
cook_time: 70
image: images/recipes/lasagne.jpg
