name: Satt & Happy Kartoffel-Bowl
description: Herzhafte Buddha-Bowl mit Kartoffeln, Rucola, cremiger Avocado, angebratenen
  Kichererbsen, gekochten Eiern und Feta, verfeinert mit einem würzigen Senf-Zitronen-Dressing.
author: mymindwentblvnk
category: 🥦
servings: 2
prep_time: 20
cook_time: 0
import_date: 2026-04-12
tags:
- Avocado
- Eier
- Feta
- Kartoffeln
- Käse
- Kerne
- Kichererbsen
- Knoblauch
- Salat
ingredients:
- name: Kartoffel
  amount: 250 g
- name: Rucola
  amount: 1 Packung
- name: Avocado
  amount: 1
- name: Kichererbsen (angebraten)
  amount: 3 EL
- name: Ei (gekocht)
  amount: 2
- name: Feta
  amount: 1
- name: Salz
  amount: nach Geschmack
- name: Pfeffer
  amount: nach Geschmack
- name: Knoblauch
  amount: nach Geschmack
- name: Oliven/getrocknete Tomaten
  amount: nach Geschmack
- name: Kerne
  amount: nach Geschmack
- name: Senf
  amount: nach Geschmack
instructions:
- Kartoffeln kochen und übernacht abkühlen lassen (bilden resistente Stärke)
- Kichererbsen anbraten
- Rucola waschen
- Dressing aus 2 EL Olivenöl, Zitronensaft, Salz, Pfeffern und Senf mit Knoblauch
  verrühren
- Feta dazu (oder als Alternative zu Kichererbsen)
