name: Französischer Zitronenkuchen (Cake au citron)
description: Saftiger Zitronenkuchen aus der Kastenform mit Crème fraîche, optionalem Zitronensirup und säuerlicher Zuckerglasur. Schmeckt am besten, wenn er vor dem Glasieren einen Tag durchgezogen ist.
author: mymindwentblvnk
url: https://www.lapaticesse.com/cake-au-citron-franzoesischer-zitronenkuchen-rezept-kastenkuchen-tipps/5153/
category: 🥣
servings: 8
prep_time: 20
cook_time: 55
import_date: 2026-10-24
tags:
  - Backen
  - Butter
  - Crème fraîche
  - Eier
  - Mehl
  - Zitrone
  - Zucker

ingredients:
  - name: Eier (Größe M, ca. 200 g, Zimmertemperatur)
    amount: 4
  - name: Zucker
    amount: 270 g
  - name: Crème fraîche
    amount: 115 g
  - name: Weizenmehl (Type 405)
    amount: 215 g
  - name: Backpulver
    amount: 5 g
  - name: Bio-Zitronen (nur die fein abgeriebene Schale)
    amount: 4
  - name: Salz
    amount: 1 g
  - name: Butter (flüssig, nicht heiß)
    amount: 90 g
  - name: Wasser (für den Sirup, optional)
    amount: 80 g
  - name: Zitronensaft (für den Sirup, optional)
    amount: 30 g
  - name: Zucker (für den Sirup, optional)
    amount: 40 g
  - name: Puderzucker (für die Glasur)
    amount: 115 g
  - name: Zitronensaft (für die Glasur)
    amount: 30 g

instructions:
  - Kastenform (ca. 20 x 11,5 x 7 cm, alternativ 23 x 13 x 7 cm) mit zugeschnittenem Backpapier auslegen und leicht einfetten. Zitronenschale abreiben, Mehl mit Backpulver sieben und die Butter flüssig, aber nicht heiß schmelzen.
  - Für den optionalen Sirup Wasser, Zucker und Zitronensaft aufkochen und abkühlen lassen.
  - Backofen auf 180°C vorheizen. Eier mit Zucker auf mittlerer Stufe schaumig schlagen, bis sich der Zucker gelöst hat und die Masse heller ist.
  - Crème fraîche, Zitronenschale, Salz und das Mehl-Backpulver-Gemisch kurz glatt rühren, dann die flüssige Butter unterrühren.
  - Teig gleichmäßig in die Form füllen und auf mittlerer Schiene backen. Nach 15 Minuten die Oberfläche mit einem in flüssige Butter getauchten Messer längs einschneiden und weitere ca. 35 Minuten backen. Gar ist der Kuchen bei 93–96°C Kerntemperatur oder wenn beim Stäbchentest kein Teig mehr haften bleibt. Wird die Oberfläche zu dunkel, locker mit Alufolie abdecken.
  - Kuchen 5 Minuten in der Form ruhen lassen, mit dem Backpapier herausheben und auf einem Gitter abkühlen lassen. Nach ca. 10 Minuten den kalten Sirup gleichmäßig aufpinseln, falls verwendet.
  - Kuchen in Frischhaltefolie wickeln und ca. 24 Stunden durchziehen lassen.
  - Backofen auf 200°C erhöhen. Puderzucker mit Zitronensaft glatt rühren, den Kuchen damit bestreichen und Überschuss abtropfen lassen. 2–3 Minuten backen, bis die Glasur fest ist, dann abkühlen lassen. Nach Belieben mit etwas Zitronenschale bestreuen.
