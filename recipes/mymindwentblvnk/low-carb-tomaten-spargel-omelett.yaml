name: Low-Carb Tomaten-Spargel-Omelett
description: Low-Carb und lecker. So beschreibt sich dieses Tomaten-Spargel-Omelett meiner Meinung nach einfach am besten. Simple Zutaten, simple Zubereitung und extravaganter Geschmack. Perfekt als dein Frühstück oder Mittagessen.
author: mymindwentblvnk
url: https://fittastetic.com/low-carb-tomaten-spargel-omelett/
category: 🥣
servings: 1
prep_time: 5
cook_time: 10
kcal: 376
import_date: 2026-05-10
image: images/recipes/low-carb-tomaten-spargel-omelett.jpg
tags:
  - Butter
  - Eier
  - Käse
  - Knoblauch
  - Kräuter
  - Petersilie
  - Spargel
  - Tomaten

ingredients:
  - name: Eier
    amount: 3
  - name: Eiklar
    amount: 2
  - name: Spargel (grün)
    amount: 100 g
  - name: Cherrytomaten
    amount: 100 g
  - name: Butter
    amount: 1 TL
  - name: Käse (gerieben, light)
    amount: 10 g
  - name: Knoblauch
    amount: etwas
  - name: Petersilie
    amount: etwas
  - name: Salz
    amount: etwas
  - name: Pfeffer
    amount: etwas

instructions:
  - Tomaten und Spargel waschen und in mundgerechte Stücke schneiden.
  - Knoblauch und Petersilie klein hacken.
  - Butter in einer Pfanne auf mittlerer Stufe erhitzen und die dicksten Spargelstücke hinzugeben.
  - Kurz anbraten lassen und allmählich das restliche Gemüse hinzugeben.
  - Das Ganze nun für 2-3 Minuten braten lassen.
  - In der Zwischenzeit die Eier zusammen mit dem Käse verquirlen und mit Petersilie, Knoblauch, Salz und Pfeffer würzen.
  - Nun die Ei-Käse Mischung langsam über das Gemüse gießen und die Pfanne mit einem Deckel abdecken.
  - Alles zusammen für 5-6 Minuten abgedeckt auf geringer bis mittlerer Stufe köcheln lassen.
  - Jetzt noch mit etwas Petersilie servieren und genießen.
