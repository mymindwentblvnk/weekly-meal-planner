name: Low Carb Karottenkuchen
description: Saftiger Karottenkuchen mit gemahlenen Mandeln statt Mehl, gesüßt mit
  Erythrit und verfeinert mit Frischkäse-Frosting - perfekt für eine kohlenhydratarme
  Ernährung.
author: Familienkost
category: 🥣
servings: 12
prep_time: 15
cook_time: 55
image: images/recipes/low-carb-karottenkuchen.jpg
tags:
- Butter
- Eier
- Frischkäse
- Karotte
- Käse
- Mandeln
- Nüsse
- Quark
ingredients:
- name: Möhren
  amount: 200 g
- name: Gemahlene Mandeln
  amount: 200 g
- name: Eier
  amount: 3
- name: Magerquark
  amount: 50 g
- name: Frischkäse
  amount: 50 g
- name: Butter (geschmolzen)
  amount: 50 g
- name: Gehackte Nüsse
  amount: 50 g
- name: Erythrit
  amount: 110 g
- name: Backpulver
  amount: 1 TL
- name: Vanilleschote
  amount: 1/2
- name: Salz
  amount: 1 Prise
- name: Frischkäse (für Frosting)
  amount: 120 g
- name: Geriebene Zitronenschale
  amount: 1 TL
- name: Erythrit (für Frosting)
  amount: 50 g
- name: Gehackte Pistazienkerne (Deko)
  amount: 2 EL
instructions:
- Die Möhren schälen und grob raspeln. Die Eier trennen und das Eiweiß mit dem Salz
  steif schlagen.
- Das Eigelb mit Erythrit und Vanillemark schaumig rühren. Den Quark, den Frischkäse
  und die geschmolzene Butter untermixen. Die Möhrenraspel unterrühren. Die gemahlenen
  Mandeln und das Backpulver in den Teig geben. Das Eiweiß und die gehackten Nüsse
  unterheben.
- Den Backofen auf 175°C Ober-/Unterhitze vorheizen. Eine 20 cm Springform fetten
  und den Teig hineingeben. Den Low Carb Karottenkuchen 50 Minuten backen. Anschließend
  auskühlen lassen.
- Die Zutaten für das Frosting mit einem Teigschaber verrühren. Auf dem ausgekühlten
  Kuchen verteilen und als Deko die gehackten Pistazien darüber streuen.
