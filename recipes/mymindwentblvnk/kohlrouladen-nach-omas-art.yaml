name: Kohlrouladen nach Omas Art
description: Klassische Kohlrouladen mit Hackfleischfüllung und brauner Soße - zarter
  Weißkohl gefüllt mit gewürztem Hackfleisch, geschmort in herzhafter Gemüsebrühe.
author: Familienkost
category: 🥩
servings: 8
prep_time: 35
cook_time: 35
image: images/recipes/kohlrouladen-nach-omas-art.jpg
tags:
- Eier
- Fleisch
- Hackfleisch
- Kohl
- Öl
- Zwiebel
ingredients:
- name: Weißkohl
  amount: 1 Kopf
- name: Hackfleisch
  amount: 400 g
- name: Zwiebel (klein)
  amount: 1
- name: Ei
  amount: 1
- name: Salz
  amount: 1 TL
- name: Pfeffer
  amount: nach Geschmack
- name: Gemüsebrühe
  amount: 800 ml
- name: Kümmel
  amount: 1 TL
- name: Öl
  amount: zum Braten
- name: Senf
  amount: 1 Tl
instructions:
- Den Weißkohl waschen, den Strunk keilförmig herausschneiden und eine große Gabel
  in die Mitte stecken. Den Kohlkopf in kochendes Salzwasser legen und 5-10 Minuten
  ziehen lassen. Herausnehmen und die weichen Blätter ablösen. Falls sich nicht alle
  Blätter lösen lassen, den Kohl noch einmal ins heiße Wasser zurückgeben.
- Die Zwiebel schälen und fein würfeln. Das Brötchen in Wasser einweichen und gut
  ausdrücken. Hackfleisch, Brötchen, Zwiebelwürfel und Ei in eine Schüssel geben.
  Mit Salz und Pfeffer würzen und gründlich durchkneten.
- Die Hackfleischmasse in 8 Portionen teilen und jeweils eine in ein Kohlblatt wickeln.
  Bei kleineren Kohlblättern 2-3 überlappend verwenden. Zuerst die Seiten einschlagen,
  dann die Kohlroulade eng aufrollen und mit Küchengarn wie ein kleines Päckchen schnüren.
- Das Öl in einer großen Pfanne erhitzen und bei Belieben die Speckwürfel dazugeben.
  Die Kohlrouladen von allen Seiten kräftig anbraten. Dann vorsichtig die warme Gemüsebrühe
  angießen, den Kümmel dazugeben und die Kohlrouladen bei mittlerer Hitze ungefähr
  30 Minuten schmoren lassen.
- Die Kohlrouladen herausnehmen. Die Speisestärke mit 50 ml kaltem Wasser glatt rühren
  und in die Soße geben. Die Soße kurz aufkochen, bis sie andickt. Mit Salz und Pfeffer
  abschmecken und nach Belieben etwas Sahne unterrühren.
