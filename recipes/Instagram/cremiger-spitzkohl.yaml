name: Cremiger Spitzkohl
description: Goldbraun angebratener Spitzkohl, überbacken in einer cremigen Parmesan-Sahne-Sauce mit Tomatenmark und Knoblauch.
author: Instagram
url: https://www.instagram.com/p/DdivY6zsDCM/
category: 🥦
servings: 3
prep_time: 10
cook_time: 35
import_date: '2026-10-16'
image: images/recipes/cremiger-spitzkohl.jpg
tags:
- Butter
- Käse
- Knoblauch
- Kohl
- Öl
- Parmesan
- Sahne
- Spitzkohl
- Tomatenmark
- Zwiebel

ingredients:
- name: Spitzkohl
  amount: 1
- name: Sahne
  amount: 400 ml
- name: Parmesan (gerieben)
  amount: 150 g
- name: Tomatenmark
  amount: 1 EL
- name: Rote Zwiebel
  amount: 1
- name: Knoblauch
  amount: etwas
- name: Öl
  amount: etwas
- name: Butter
  amount: etwas
- name: Salz und Pfeffer
  amount: nach Geschmack

instructions:
- Spitzkohl halbieren und in ca. 8 Stücke schneiden, den Strunk dabei dranlassen.
- Die Stücke in Butter und Öl von beiden Seiten langsam goldbraun braten und in eine Auflaufform geben.
- Zwiebel würfeln und in etwas Butter glasig dünsten. Knoblauch und Tomatenmark kurz mitrösten, mit Sahne ablöschen, Parmesan einrühren und mit Salz und Pfeffer abschmecken.
- Sauce über den Spitzkohl geben, etwas Parmesan darüberreiben und bei 180 °C Umluft ca. 20–25 Minuten backen.
- Dazu passen Kartoffelpüree, Salzkartoffeln oder Reis.
