name: Reisnudelsalat mit Tofu-Chili-Dressing
description: Bunter Reisnudelsalat mit knackigem Gemüse, Edamame und cremigem Tofu-Chili-Dressing mit Miso und Erdnussmus.
author: Instagram
url: https://www.instagram.com/p/DXehoJwNQyp/
category: 🥣
servings: 4
prep_time: 20
cook_time: 10
kcal: 330
import_date: 2026-04-29
tags:
- Edamame
- Gurke
- Karotte
- Knoblauch
- Kräuter
- Limette
- Paprika
- Pasta
- Rotkohl
- Tofu
- Zwiebel

ingredients:
- name: Reisnudeln
  amount: 200 g
- name: Rotkohl
  amount: 200 g
- name: Gurke
  amount: 1
- name: Frühlingszwiebeln
  amount: 2
- name: Paprika (rot)
  amount: 1
- name: Karotte (groß)
  amount: 1
- name: Koriander oder Petersilie
  amount: 1 Handvoll
- name: Edamame (TK oder Dose)
  amount: 300 g
- name: Seidentofu
  amount: 400 g
- name: Sojasauce
  amount: 5 EL
- name: Reisessig
  amount: 1 EL
- name: Ahornsirup
  amount: 1 TL
- name: Knoblauchzehe
  amount: 1
- name: Erdnussmus
  amount: 1 EL
- name: Miso-Paste
  amount: 2 TL
- name: Chili-Öl
  amount: 1 TL
- name: Limette
  amount: 0.5

instructions:
- Rotkohl, Gurke, Frühlingszwiebeln, Karotte und Paprika klein schneiden.
- Koriander oder Petersilie klein hacken.
- Edamame für 3-5 Minuten kochen.
- Reisnudeln nach Packungsanleitung zubereiten.
- Für das Dressing alle Zutaten (Seidentofu, Sojasauce, Reisessig, Ahornsirup, Knoblauch, Erdnussmus, Miso-Paste, Chili-Öl und Limettensaft) in einen Mixer geben und pürieren.
- Alle Zutaten in eine Schüssel geben und mit dem Dressing vermengen.
