name: Cheesecake
description: Proteinreicher Low-Carb Cheesecake mit Magerquark und Frischkäse, gesüßt
  mit Erythrit und verfeinert mit Vanillepuddingpulver.
author: Instagram
category: 🥣
servings: 1
prep_time: 15
cook_time: 50
image: images/recipes/cheesecake.jpg
tags:
- Eier
- Frischkäse
- Käse
- Milch
- Quark
ingredients:
- name: Magerquark
  amount: 1000 g
- name: Frischkäse
  amount: 400 g
- name: Schlagsahne (leicht, 7 %)
  amount: 200 ml
- name: Erythrit
  amount: 180 g
- name: Vanillepuddingpulver
  amount: 2 Päckchen
- name: Eier
  amount: 4
instructions:
- Backofen auf 180°C Umluft vorheizen, eine 23cm Springform mit Butter gut einfetten.
- Alle Zutaten mit dem Mixer gut verrühren und eventuell nach süßen. Masse in die
  Springform gießen.
- Für 50min in den Backofen geben. Ich decke ihn nach der Halfte der Zeit immer ab,
  damit er nicht zu dunkel wird.
- Lange genug abkühlen lassen(am besten im Kühlschrank) und genießen
import_date: '2026-02-26'
