name: Kartoffel-Lasagne
description: Herzhafter Auflauf mit geschichteten Kartoffelscheiben, würziger Hackfleischsauce
  in Tomatensauce und cremiger Béchamelsoße, überbacken mit Käse.
author: Instagram
category: 🥩
servings: 2
prep_time: 30
cook_time: 70
image: images/recipes/kartoffel-lasagne.jpg
tags:
- Butter
- Fleisch
- Hackfleisch
- Kartoffeln
- Käse
- Mehl
- Milch
- Paprika
- Tomate
- Zwiebel
ingredients:
- name: Hackfleisch (gemischt)
  amount: 500g
- name: Kartoffeln (mittelgroß)
  amount: 8
- name: Zwiebeln
  amount: 1
- name: Tomatenmark
  amount: 3 EL
- name: Cocktailtomaten
  amount: 150 g
- name: Stückige Tomaten
  amount: 1 Dose
- name: Käse (gerieben)
  amount: 1 Packung
- name: Paprikapulver
  amount: etwas
- name: Salz
  amount: etwas
- name: Pfeffer
  amount: etwas
- name: Milch
  amount: 500 g
- name: Butter
  amount: 40 g
- name: Buchweizenmehl
  amount: 40 g
- name: Salz
  amount: etwas
- name: Pfeffer
  amount: etwas
- name: Muskat
  amount: etwas
instructions:
- Zwiebeln hacken und in eine Pfanne mit Öl anbraten, das Hack dazugeben, mitbraten
  und gut würzen. Dann die Cocktailtomaten und die Tomaten aus der Dose dazugeben
  und gut abschmecken.
- Die Kartoffeln schälen und in circa 0,5 cm dicke Scheiben schneiden. In einer Auflaufform
  die Kartoffeln rein geben und mit der Fleischsauce bedecken.
- Danach die Béchamelsoße darüber geben und alles durch rühren. Zum Schluss noch mit
  Käse bestreuen und bei 180° circa 30 Minuten in den Ofen geben.
