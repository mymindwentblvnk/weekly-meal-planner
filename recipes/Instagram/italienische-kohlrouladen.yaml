name: Italienische Kohlrouladen
description: Dicke Kohlscheiben mit Tomatenmark und Hackfleisch, mit Käse überbacken in einer cremigen Sahne-Soja-Sauce.
author: Instagram
url: https://www.instagram.com/p/Ddl2GXqs2qn/
category: 🥩
servings: 2
prep_time: 10
cook_time: 45
import_date: '2026-10-16'
image: images/recipes/italienische-kohlrouladen.jpg
tags:
- Fleisch
- Hackfleisch
- Käse
- Kohl
- Mozzarella
- Sahne
- Sojasauce
- Tomatenmark
- Zwiebel

ingredients:
- name: Kohlscheiben (Weißkohl oder Spitzkohl, dick)
  amount: 2
- name: Hackfleisch
  amount: 300–350 g
- name: Tomatenmark
  amount: 4 EL
- name: Zwiebel (klein)
  amount: 1
- name: Geriebener Käse (z.B. Mozzarella)
  amount: 80 g
- name: Sahne
  amount: 300 ml
- name: Sojasauce
  amount: 30 ml
- name: Speisestärke
  amount: 1 TL
- name: Salz und Pfeffer
  amount: nach Geschmack

instructions:
- Ofen auf 180 °C Ober-/Unterhitze vorheizen. Kohlscheiben in eine Auflaufform legen und mit 2 EL Tomatenmark bestreichen.
- Hackfleisch auf beide Scheiben verteilen und flach drücken. Zwiebel in feine Ringe schneiden, darauf verteilen, mit Salz und Pfeffer würzen und mit Käse bestreuen.
- Für die Sauce Sahne, Sojasauce, Speisestärke, 2 EL Tomatenmark und etwas Pfeffer glatt verrühren und in die Auflaufform geben.
- Form abdecken und ca. 35 Minuten backen. Abdeckung entfernen und weitere 10 Minuten backen, bis der Kohl weich und der Käse goldbraun ist.
