name: Darmfreundlicher Smashed Burger mit Süßkartoffel-Bun
description: Naturbelassener Smashed Burger mit selbstgemachten Süßkartoffel-Buns, Rinderhackfleisch-Patties und frischem Avocado-Belag.
author: Instagram
url: https://www.instagram.com/p/DUaPWrFjDhc/
category: 🍲
servings: 2
prep_time: 20
cook_time: 15
import_date: 2026-04-29
tags:
- Avocado
- Eier
- Fleisch
- Frischkäse
- Hackfleisch
- Honig
- Kartoffeln
- Käse
- Rind
- Süßkartoffel

ingredients:
- name: Süßkartoffel
  amount: 1
- name: Ei
  amount: 1
- name: Rohmilchkäse
  amount: 50-100 g
- name: Rinderhackfleisch
  amount: 140-160 g
- name: Salz
  amount: nach Geschmack
- name: Pfeffer
  amount: nach Geschmack
- name: Avocado
  amount: 1
- name: Rohhonig
  amount: 1 TL
- name: Körniger Frischkäse
  amount: nach Geschmack

instructions:
- Süßkartoffel weich kochen oder backen, mit Ei und Rohmilchkäse vermengen und zu Burger-Buns formen.
- Buns im Ofen bei 180°C ca. 15-20 Minuten backen bis sie fest sind.
- Rinderhackfleisch in Portionen von 70-80g teilen, zu lockeren Bällchen formen.
- Hackfleischbällchen in heißer Pfanne platzieren und mit einem Pfannenwender flach drücken (smashed).
- Patties von beiden Seiten braten und mit Salz und Pfeffer würzen.
- Avocado pürieren und mit Rohhonig vermischen.
- Burger zusammenbauen mit Süßkartoffel-Bun, Patty, Avocado-Mix, körnigem Frischkäse und oberem Bun.
