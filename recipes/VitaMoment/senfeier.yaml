name: Senfeier
description: Hartgekochte Eier in einer cremigen Senfsoße mit Buchweizen, verfeinert
  mit Honig und Schlagsahne, serviert auf Kartoffeln – ein herzhafter Klassiker mit
  einem Hauch Süße.
author: VitaMoment
category: 🥦
servings: 1
prep_time: 10
cook_time: 25
image: images/recipes/senfeier.jpg
tags:
- Butter
- Eier
- Honig
- Kartoffeln
- Mehl
- Zwiebel
ingredients:
- name: Eier
  amount: 3
- name: Frühlingszwiebel
  amount: 1
- name: Butter
  amount: 5 g
- name: Buchweizenmehl
  amount: 15 g
- name: Gemüsebrühe
  amount: 75 ml
- name: Schlagsahne
  amount: 25 ml
- name: Senf (laktose- und glutenfrei)
  amount: 10 g
- name: Honig
  amount: 5 g
- name: Kartoffeln
  amount: 200 g
instructions:
- Eier in kochendem Wasser ca. 6-10 Minuten kochen. Abschrecken und pellen.
- Zucchiniwaschen und klein schneiden. Frühlingszwiebel putzen und in feine Ringe
  schneiden.
- Butter in einem kleinen Topf schmelzen und die Frühlingszwiebeln glasig dünsten.
  Zucchini hinzugeben und kurz mit braten.
- Buchweizenmehl hinzugeben und mit Gemüsebrühe und Sahne aufkochen.
- Senf und Honig unterrühren. Mit Salz und Pfeffer abschmecken.
- Kartoffeln waschen, schälen und halbieren. In einem Topf mit kochendem Salzwasser
  ca. 15-20 Minuten köcheln.
- Kartoffeln abgießen und auf einem Teller servieren. Eier halbieren und mit der Senfsoße
  über die Kartoffeln geben.
