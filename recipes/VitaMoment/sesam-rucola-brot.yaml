name: Sesam-Rucola-Brot
description: Herzhaftes Brot mit Rucola, Haferflocken und Sesam.
author: VitaMoment
category: 🍞
servings: 1
prep_time: 10
cook_time: 50
image: images/recipes/sesam-rucola-brot.jpg
tags:
- Eier
- Frühstück
- Haferflocken
- Kerne
- Quark
- Salat
- Sesam
- Tomate
ingredients:
- name: Rucola
  amount: 60 g
- name: Getrocknete Tomaten (ohne Öl)
  amount: 20 g
- name: Haferflocken
  amount: 500 g
- name: Quark (Fettanteil 20%)
  amount: 500 g
- name: Backpulver
  amount: 25 g
- name: Eier
  amount: 3
- name: Sesam
  amount: 40 g
instructions:
- Backofen auf 180 °C Ober-/Unterhitze vorheizen.
- Rucola und getrocknete Tomaten klein schneiden.
- Haferflocken, Quark, Backpulver, Eier, Rucola, Tomaten, Salz und Pfeffer zu einem
  Teig vermengen.
- Brotlaib formen, mit etwas Wasser bestreichen und Sesam bestreuen.
- Brot auf ein mit Backpapier ausgelegtes Backblech legen und für etwa 50 Minuten
  backen.
import_date: '2026-02-26'
