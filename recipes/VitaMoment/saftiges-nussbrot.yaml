name: Saftiges Nussbrot
description: Herzhaftes Brot mit Natron, Mandeln (gemahlen) und Sonnenblumenkerne.
author: VitaMoment
category: 🍞
servings: 1
prep_time: 10
cook_time: 60
image: images/recipes/saftiges-nussbrot.jpg
tags:
- Butter
- Eier
- Frühstück
- Kerne
- Leinsamen
- Mandeln
- Nüsse
- Sesam
ingredients:
- name: Eier
  amount: 3
- name: Jogurth (1,5% Fettanteil)
  amount: 100 g
- name: Butter
  amount: 50 g
- name: Natron
  amount: 1 Packung
- name: Salz
  amount: 1 Prise
- name: Mandeln (gemahlen)
  amount: 200 g
- name: Sonnenblumenkerne
  amount: 150 g
- name: Leinsamen
  amount: 50 g
- name: Sesam
  amount: 100 g
- name: Kürbiskerne
  amount: 50 g
instructions:
- Backofen auf 180 °C Ober-/Unterhitze vorheizen.
- Eier in einer großen Schüssel aufschlagen und Joghurt unterrühren.
- Butter schmelzen und untermengen. Natron und Salz dazugeben.
- Gemahlene Mandeln, Sonnenblumenkerne, Leinsamen, Sesam und Kürbiskerne vorsichtig
  unterheben.
- Den Teig in eine mit Backpapier ausgekleidete Kastenform füllen und für etwa 60
  Minuten backen.
import_date: '2026-02-26'
