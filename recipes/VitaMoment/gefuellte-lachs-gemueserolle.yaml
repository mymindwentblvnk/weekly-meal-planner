name: Gefüllte Lachs-Gemüserolle
description: Gerollter Gemüseteig gefüllt mit Räucherlachs, Frischkäse und frischen
  Kräutern.
author: VitaMoment
category: 🐟
servings: 1
prep_time: 15
cook_time: 40
image: images/recipes/gefuellte-lachs-gemueserolle.jpg
tags:
- Eier
- Fisch
- Frischkäse
- Karotte
- Käse
- Kräuter
- Lachs
- Zucchini
- Zwiebel
ingredients:
- name: Zucchini
  amount: 200 g
- name: Möhren
  amount: 200 g
- name: Zwiebel
  amount: 1
- name: Eier
  amount: 3
- name: Frischkäse mit Kräutern (Doppelrahmstufe)
  amount: 150 g
- name: Wildräucherlachs
  amount: 200 g
- name: Dill
  amount: 1 EL
- name: Schnittlauch (getrocknet)
  amount: 1 EL
instructions:
- Backofen auf 180 °C Umluft vorheizen.
- Zucchini und Möhren schälen, reiben und salzen, kurz ziehen lassen und anschließend
  die Flüssigkeit mit einem Küchentuch ausdrücken.
- Zwiebel schälen und würfeln.
- Eier zu der Gemüsemasse geben und alles gründlich vermengen.
- Die Masse gleichmäßig in rechteckiger Form auf einem mit Backpapier ausgelegten
  Backblech verteilen und für rund 30 Minuten backen.
- Den gebackenen Teig auf dem Backpapier aus dem Ofen nehmen, einige Minuten abkühlen
  lassen und vorsichtig vom Backpapier lösen.
- Anschließend mit Frischkäse bestreichen und Wild-räucherlachs, Dill und Schnittlauch
  darauf verteilen.
- Den belegten Teig vorsichtig zusammenrollen, in 2 Portionen teilen und eine davon
  genießen.
- Die 2. Portion lässt sich perfekt in Frischhaltefolie im Kühlschrank für den nächsten
  Tag aufbewahren.
import_date: '2026-02-26'
