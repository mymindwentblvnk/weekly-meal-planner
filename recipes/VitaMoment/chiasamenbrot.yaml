name: Chiasamenbrot
description: Proteinreiches Brot ohne Weizen mit Chia, Leinsamen und Mandeln.
author: VitaMoment
category: 🍞
servings: 1
prep_time: 10
cook_time: 60
image: images/recipes/chiasamenbrot.jpg
tags:
- Chiasamen
- Eier
- Frühstück
- Haferflocken
- Kerne
- Leinsamen
- Mandeln
- Nüsse
- Quark
ingredients:
- name: Magerquark
  amount: 300 g
- name: Eier
  amount: 4
- name: Chiasamen
  amount: 100 g
- name: Leinsamen (geschrotet)
  amount: 30 g
- name: Mandeln (gemahlen)
  amount: 70 g
- name: Backpulver
  amount: 12 g
- name: Chiliflocken
  amount: 1 Prise
- name: Haferflocken (zum Bestreuen)
  amount: 20 g
instructions:
- Backofen auf 180 °C Ober-/Unterhitze vorheizen.
- Magerquark mit den Eiern in einer großen Schüssel cremig rühren.
- Chiasamen, Leinsamen, Mandeln, Backpulver, Salz, Pfeffer und Chiliflocken hinzufügen
  und gut vermengen.
- In eine mit Backpapier ausgekleidete Kastenform füllen, etwas Wasser aufpinseln
  und nach Belieben mit Haferflocken bestreuen.
- Für etwa 60 Minuten im Ofen backen.
import_date: '2026-02-26'
